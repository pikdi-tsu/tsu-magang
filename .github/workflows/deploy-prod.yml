name: Deploy to DirectAdmin (Production)
on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Fast Deploy to DirectAdmin
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install NPM dependencies and build
        run: |
          npm install
          npm run build

      - name: Sync Core files to DirectAdmin
        uses: SamKirkland/FTP-Deploy-Action@v4.3.3
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /domains/magang.tsu.ac.id/tsu_magang_core/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            *.sqlite
            phpunit.xml
            vendor/**
            node_modules/**
            .idea/**
            .vscode/**
            .DS_Store
            storage/logs/*.log
            public/**

      - name: Sync Public files to DirectAdmin
        uses: SamKirkland/FTP-Deploy-Action@v4.3.3
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: public/
          server-dir: /domains/magang.tsu.ac.id/public_html/

      - name: Execute Server Scripts via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_NAME: ${{ secrets.APP_NAME }}
          APP_URL: ${{ secrets.APP_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          debug: true
          envs: APP_NAME,APP_URL,DB_HOST,DB_PORT,DB_DATABASE,DB_USERNAME,DB_PASSWORD
          script: |
            set -e
            
            cd domains/magang.tsu.ac.id/public_html
            # Adjust index.php paths to point to tsu_magang_core instead of going up one directory
            # By default Laravel public/index.php has: __DIR__.'/../vendor/autoload.php'
            # We change it to point to the core folder
            sed -i "s|__DIR__.'/../storage/|__DIR__.'/../tsu_magang_core/storage/|g" index.php
            sed -i "s|__DIR__.'/../vendor/|__DIR__.'/../tsu_magang_core/vendor/|g" index.php
            sed -i "s|__DIR__.'/../bootstrap/|__DIR__.'/../tsu_magang_core/bootstrap/|g" index.php
            
            cd ../tsu_magang_core
            mkdir -p storage/framework/{sessions,views,cache}
            mkdir -p bootstrap/cache

            if [ ! -f .env ]; then cp .env.example .env; fi
            touch database/database.sqlite

            APP_NAME=$(echo "$APP_NAME" | tr -d '\r\n')
            APP_URL=$(echo "$APP_URL" | tr -d '\r\n ')
            DB_HOST=$(echo "$DB_HOST" | tr -d '\r\n ')
            DB_PORT=$(echo "$DB_PORT" | tr -d '\r\n ')
            DB_DATABASE=$(echo "$DB_DATABASE" | tr -d '\r\n ')
            DB_USERNAME=$(echo "$DB_USERNAME" | tr -d '\r\n ')
            DB_PASSWORD=$(echo "$DB_PASSWORD" | tr -d '\r\n')

            update_env() {
                local key=$1
                local val=$2
                if [ -n "$val" ]; then
                    local escaped_val=$(echo "$val" | sed 's/"/\\"/g')
                    if grep -q "^${key}=" .env; then
                        sed -i "s|^${key}=.*|${key}=\"${escaped_val}\"|" .env
                    else
                        echo "${key}=\"${escaped_val}\"" >> .env
                    fi
                fi
            }

            update_env "APP_NAME" "$APP_NAME"
            update_env "APP_URL" "$APP_URL"
            update_env "DB_HOST" "$DB_HOST"
            update_env "DB_PORT" "$DB_PORT"
            update_env "DB_DATABASE" "$DB_DATABASE"
            update_env "DB_USERNAME" "$DB_USERNAME"
            update_env "DB_PASSWORD" "$DB_PASSWORD"
            
            update_env "APP_ENV" "production"
            update_env "APP_DEBUG" "false"
            update_env "FORCE_HTTPS" "true"
            update_env "SESSION_SECURE_COOKIE" "true"

            wget -O composer.phar https://getcomposer.org/download/latest-stable/composer.phar
            export COMPOSER_ALLOW_SUPERUSER=1
            php composer.phar install --ignore-platform-reqs --no-dev --optimize-autoloader

            php artisan optimize:clear

            if ! grep -q "^APP_KEY=base64:" .env; then
                php artisan key:generate --force
            fi

            php artisan optimize
            php artisan view:cache
            
            # Membuat symlink storage/app/public ke public_html/storage
            ln -sfn $(pwd)/storage/app/public ../public_html/storage

            php artisan migrate --force

            chmod -R 755 storage bootstrap/cache
            chmod 600 storage/*.key 2>/dev/null || true
